name: V2T
options:
  bundleIdPrefix: com.example.v2t
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  V2T:
    type: application
    platform: iOS
    sources:
      - V2T/Sources
      - V2T/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.v2t.meetingmemo
        PRODUCT_NAME: V2T
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: V2T/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
